<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header">
      <img width="200" src="assets/auto-store-long.webp" alt="logo" />
    </div>

    <table class="exchange-table">
      <tr>
        <th>USD/KRW</th>
        <th>USD/EUR</th>
        <th>USD/MDL</th>
      </tr>
      <tr>
        <td align="center"><input type="number" id="KRWInput" /></td>
        <td align="center"><input type="number" id="EURInput" /></td>
        <td align="center"><input type="number" id="MDLInput" /></td>
      </tr>
    </table>

    <div class="options">
      <label>
        Asigurare (1.5%)
        <input type="checkbox" id="insuranceCheckbox" />
      </label>

      <label>
        Livrare

        <select id="shippmentSelect" style="padding: 5px">
          <option selected value="standard">Standard</option>
          <option value="fast">Rapidă</option>
        </select>
      </label>

      <label>
        Valuta

        <select id="currencySelect" style="padding: 5px">
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="MDL">MDL</option>
        </select>
      </label>
    </div>

    <div class="input-container">
      <button id="calculateBtn">Calculează</button>
    </div>

    <img src="/assets/loading.svg" width="80" height="80" alt="loading" id="loader" />

    <div class="price-breakdown">
      <table id="priceBreakdown"></table>

      <b> Preț final: <span id="totalPrice"></span> </b>
    </div>

    <script src="popup.js" defer></script>
  </body>
</html>
